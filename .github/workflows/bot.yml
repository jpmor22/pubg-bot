name: Bot PUBG.report

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botao "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: pubg-bot
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Rodar o bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python pubg_bot.py --uma-vez

      - name: Salvar o que ja foi enviado
        run: |
          git config user.name "pubg-bot"
          git config user.email "pubg-bot@users.noreply.github.com"
          git add vistos.json jogadores.json
          git diff --cached --quiet || (git commit -m "estado do bot [skip ci]" && git pull --rebase && git push)
